name: Numerical and reproduction checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip check
      - run: python scripts/fetch_posteriordb.py
      - name: Choose workers within the runner's available CPU allocation
        run: python -c "from dcs_bench.cpu import cpu_info; import os; info=cpu_info(); print(info); open(os.environ['GITHUB_ENV'], 'a').write('BENCH_WORKERS='+str(min(2, info['capacity']))+'\n')"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_draw_storage.py --output results/ci-draw-storage.json
      - run: python -m examples.basic_sampler
      - name: Reported zero-centre JAX study (100D)
        run: python run_experiment.py reported-zero-centre --target skew-t-100d --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-reported-100d-jax
      - run: python run_experiment.py --plot-only results/ci-reported-100d-jax
      - name: Reported parameters Numba extension (500D)
        run: python run_experiment.py reported-zero-centre-numba --target skew-t-500d --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-reported-500d-numba
      - run: python run_experiment.py sampler-comparison --target skew-t-100d --preset quick --runs 3 --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-single-scs
      - run: python run_experiment.py --plot-only results/ci-single-scs
      - run: python scripts/reproduce_scs_step_control.py results/ci-single-scs --output-dir results/ci-scs-acceptance
      - run: python run_experiment.py sampler-comparison-numba --target skew-t-100d --preset quick --runs 3 --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-numba-vi
      - run: python run_experiment.py --plot-only results/ci-numba-vi
      - run: python run_experiment.py sampler-comparison --target skew-t-500d --preset quick --runs 1 --workers 1 --output-dir results/ci-500d-jax
      - run: python run_experiment.py sampler-comparison-numba --target skew-t-500d --preset quick --runs 1 --workers 1 --output-dir results/ci-500d-numba
      - run: python prepare_reference.py --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-reference
      - run: python run_experiment.py skew-t-200d-nuts --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci
      - run: python run_experiment.py --plot-only results/ci
      - run: python run_experiment.py skew-t-200d-nuts --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci --resume
      - run: python scripts/audit_fixed_steps.py --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-audit
      - run: python scripts/audit_symmetric_t.py --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-symmetric
      - run: python scripts/audit_skew_t_timed.py --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-skew-timed
      - run: python scripts/audit_joint_radial.py --preset quick --pilot-seconds 1.0 --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-joint-r-step
      - run: python run_experiment.py skew-t-50d-nu-0.5 --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-superheavy-counts
      - run: python run_experiment.py skew-t-200d-baselines --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-baselines
      - run: python run_experiment.py eight-schools --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-eight-schools
      - run: python scripts/benchmark_result_processing.py --input results/ci-eight-schools --repeat 1 --diagnostic-workers ${{ env.BENCH_WORKERS }} --output results/ci-processing.json
      - run: python run_experiment.py garch11 --preset quick --workers ${{ env.BENCH_WORKERS }} --output-dir results/ci-garch11
      - run: python run_experiment.py logistic-regression --preset quick --workers ${{ env.BENCH_WORKERS }} --reference-dir results/ci-reference --output-dir results/ci-logistic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results-${{ matrix.os }}
          path: |
            results/ci
            results/ci-reference
            results/ci-audit
            results/ci-symmetric
            results/ci-skew-timed
            results/ci-joint-r-step
            results/ci-superheavy-counts
            results/ci-single-scs
            results/ci-scs-acceptance
            results/ci-numba-vi
            results/ci-500d-jax
            results/ci-500d-numba
            results/ci-baselines
            results/ci-eight-schools
            results/ci-processing*.json
            results/ci-draw-storage.json
            results/ci-garch11
            results/ci-logistic
            results/ci-reported-100d-jax
            results/ci-reported-500d-numba
