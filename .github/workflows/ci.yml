name: Numerical and reproduction checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip check
      - run: python scripts/fetch_posteriordb.py
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.basic_sampler
      - run: python run_experiment.py skew-t-200d-nuts --preset quick --output-dir results/ci
      - run: python run_experiment.py --plot-only results/ci
      - run: python run_experiment.py skew-t-200d-nuts --preset quick --output-dir results/ci --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: results/ci
