[project]
name = "projection-sampler-heavy-tails"
version = "0.1.0"
description = "Reproducible heavy-tailed sampling experiments for a projection sampler."
readme = "README.md"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
